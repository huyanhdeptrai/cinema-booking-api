services:
  # 1. dịch vụ Database mysql 8.0
  mysql-db:
    image: mysql:8.0
    container_name: cinema-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-cinema_db}
      MYSQL_USER: ${DB_USER:-cinema_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cinema_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - cinema_mysql_data:/var/lib/mysql
    healthcheck:
      # kiểm tra xem mysql đã thực sự sẵn sàng nhận kết nối hay chưa
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. dịch vụ spring boot api
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema-api
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # trỏ tới mysql-db thay vì localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${DB_NAME:-cinema_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cinema_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cinema_password}
      JWT_SECRET: ${JWT_SECRET:-9a7f5c2d8b1e4a6f0c3e5d7b9a1f2c4e6a8b0d2f4c6e8a0b2d4f6c8e0a2b4c6e}
    depends_on:
      mysql-db:
        condition: service_healthy # chỉ bật app khi mysql đã hoàn toàn sẵn sàng

volumes:
  cinema_mysql_data: