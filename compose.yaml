services:
  # 1. dịch vụ Database mysql 8.0
  mysql-db:
    image: mysql:8.0
    container_name: cinema-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?can khai bao DB_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${DB_NAME:-cinema_db}
      MYSQL_USER: ${DB_USER:-cinema_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?can khai bao DB_PASSWORD trong .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - cinema_mysql_data:/var/lib/mysql
    healthcheck:
      # kiểm tra xem mysql đã thực sự sẵn sàng nhận kết nối hay chưa
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:?can khai bao DB_ROOT_PASSWORD trong .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. dịch vụ spring boot api
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema-api
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # chọn cấu hình dành cho docker
      SPRING_PROFILES_ACTIVE: docker

      # các container kết nối với nhau qua tên service
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${DB_NAME:-cinema_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cinema_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?can khai bao DB_PASSWORD trong .env}

      JWT_SECRET: ${JWT_SECRET:?can khai bao JWT_SECRET trong .env}

      # cổng thanh toán Vinatti simulator
      VINATTI_GATEWAY_URL: ${VINATTI_GATEWAY_URL:-http://host.docker.internal:9011/Zalo/Execute}
      SIM_ACCESS_KEY: ${SIM_ACCESS_KEY:-gateway-demo-access-2026}
      SIM_SECRET_KEY: ${SIM_SECRET_KEY:-gateway-demo-secret-2026}
      SIM_CALLBACK_KEY_ID: ${SIM_CALLBACK_KEY_ID:-callback-key-01}
      SIM_CALLBACK_SECRET: ${SIM_CALLBACK_SECRET:-callback-demo-secret-0123456789abcdef}

    depends_on:
      mysql-db:
        condition: service_healthy # chỉ bật app khi mysql đã hoàn toàn sẵn sàng

volumes:  
  cinema_mysql_data:
