# chứa toàn bộ cấu hình cho môi trường dev, chạy local với docker-compose
# Datasource (kết nối với DB MySQL Docker Dev)
spring.datasource.url=jdbc:mysql://localhost:3306/cinema_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=cinema_user
spring.datasource.password=cinema_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# đặt là validate chỉ để kiểm tra với DB do flyway tạo, không tự sinh hay sửa bảng
spring.jpa.hibernate.ddl-auto=validate
#in ra câu lệnh SQL khi chạy giúp cho debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# kích hoạt flyway
spring.flyway.enabled=true
# đường dẫn đến các file migration SQL, mặc định là classpath:db/migration
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT configuration
# secret lấy từ biến môi trường, có thể fallback sang giá trị mặc định
# chuỗi secret key cho HMAC SHA256 nên ph dài tối thiểu 256 bits ít nhất 32 ký tự
jwt.secret=${JWT_SECRET:9a7f5c2d8b1e4a6f0c3e5d7b9a1f2c4e6a8b0d2f4c6e8a0b2d4f6c8e0a2b4c6e}
# hạn sử dụng token, tương đương 24h
jwt.expiration-ms=86400000

