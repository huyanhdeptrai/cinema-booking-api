spring.application.name=cinema-booking-api
# dùng dev khi chưa chọn profile khác
spring.profiles.default=dev

#cấu hình đường dẫn swagger ui với openapi docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ép buộc toàn bộ truy vấn database phải diễn ra trong tầng @Transactional của Service, không để lọt truy vấn ra ngoài Controller
spring.jpa.open-in-view=false

# cấu hình cổng thanh toán vinatti zma simulator
# địa chỉ gọi sang gateway để tạo đơn
vinatti.gateway-url=${VINATTI_GATEWAY_URL:http://127.0.0.1:9011/Zalo/Execute}
vinatti.access-key=${SIM_ACCESS_KEY:gateway-demo-access-2026}
vinatti.secret-key=${SIM_SECRET_KEY:gateway-demo-secret-2026}

# khoá dùng để xác thực webhook calback (ordersync, orderinfo) do Simulator gọi vào
vinatti.callback.key-id=${SIM_CALLBACK_KEY_ID:callback-key-01}
vinatti.callback.secret=${SIM_CALLBACK_SECRET:callback-demo-secret-0123456789abcdef}